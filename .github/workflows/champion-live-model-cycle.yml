name: Champion genuine-model autonomous source repair & RSI

on:
  push:
    branches: [dominion-champion]
    paths:
      - '.github/workflows/champion-live-model-cycle.yml'
      - 'scripts/champion-live-model-campaign.mjs'
      - 'src/engine/chat/runtime.rs'
      - 'src/engine/rsi_evolve.rs'
      - 'src/engine/rsi.rs'
      - 'src/engine/rsi_action_program.rs'
      - 'src/engine/rsi_repair_synthesis.rs'
      - 'src/engine/rsi_success_ablation.rs'
      - 'src/engine/rsi_judgement.rs'
      - 'src/engine/rsi_worktree.rs'
      - 'src/engine/jobs.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-model:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOMINION_PORT: '43173'
      DOMINION_JOB_WORKERS: '1'
      DOMINION_EXPERIMENT_SCHEDULER: '0'
      CHAMPION_LIVE_REPORT: benchmark/champion-live-campaign-result.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe a genuine model, not a fixture
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          node scripts/champion-live-model-campaign.mjs probe | tee /tmp/champion-model-probe.log
          if grep -Fq 'CHAMPION_MODEL_REACHABLE=true' /tmp/champion-model-probe.log; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo 'No reachable anonymous model. No autonomous improvement result is claimed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.probe.outputs.reachable == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.probe.outputs.reachable == 'true'
      - uses: actions/setup-node@v4
        if: steps.probe.outputs.reachable == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web && npm run build --prefix web
        if: steps.probe.outputs.reachable == 'true'
      - run: cargo build --release --locked --bin dominion-rust
        if: steps.probe.outputs.reachable == 'true'
      - name: Let DOMINION execute a genuine model-written source improvement
        if: steps.probe.outputs.reachable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/champion-source" "$(git rev-parse HEAD)"
          export DOMINION_DATA="$RUNNER_TEMP/champion-data"
          export DOMINION_WORKSPACE="$RUNNER_TEMP/champion-source"
          export DOMINION_SOURCE_WORKSPACE="$RUNNER_TEMP/champion-source"
          mkdir -p "$DOMINION_DATA"
          node scripts/champion-live-model-campaign.mjs proxy > "$RUNNER_TEMP/champion-proxy.log" 2>&1 &
          proxy_pid=$!
          ./target/release/dominion-rust > "$RUNNER_TEMP/champion-engine.log" 2>&1 &
          engine_pid=$!
          trap 'kill "$proxy_pid" "$engine_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if curl -fsS "http://127.0.0.1:$DOMINION_PORT/api/health" > /dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:$DOMINION_PORT/api/health"
          node scripts/champion-live-model-campaign.mjs run
          cat "$CHAMPION_LIVE_REPORT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: champion-real-model-attempt
          path: |
            benchmark/champion-live-campaign-result.json
          if-no-files-found: ignore
