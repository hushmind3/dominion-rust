name: Sub4 actual local Ollama RSI attempt
# Owner-requested campaigns have been launched; future runs are manual.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-model-rsi:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      SUB4_MODEL_KIND: ollama
      SUB4_BASE_MODEL: qwen3:4b-instruct
      SUB4_MODEL_NAME: sub4-qwen3-16k:latest
      SUB4_OLLAMA_URL: http://127.0.0.1:11434
      SUB4_CAMPAIGN_SECONDS: '3600'
      SUB4_RUN_DEADLINE_MS: '3800000'
      DOMINION_PORT: '43179'
      DOMINION_JOB_WORKERS: '1'
      OLLAMA_CONTEXT_LENGTH: '16384'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_KEEP_ALIVE: '45m'
      SUB4_LIVE_REPORT: benchmark/sub4-local-ollama-rsi-result.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build actual DOMINION runner
        run: |
          node --check scripts/sub4-live-rsi.mjs
          npm ci --prefix web
          npm run build --prefix web
          cargo build --release --locked --bin dominion-rust
      - name: Start Ollama and fetch actual local inference model
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > "$RUNNER_TEMP/sub4-ollama.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS "$SUB4_OLLAMA_URL/api/tags" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          ollama pull "$SUB4_BASE_MODEL"
          # OpenAI /v1/chat/completions has no num_ctx field; the model itself
          # must carry the context length to avoid second-generation HTTP 400.
          printf 'FROM %s\nPARAMETER num_ctx 16384\n' "$SUB4_BASE_MODEL" > "$RUNNER_TEMP/sub4.Modelfile"
          ollama create "$SUB4_MODEL_NAME" -f "$RUNNER_TEMP/sub4.Modelfile"
          ollama show --modelfile "$SUB4_MODEL_NAME" | grep -Eq 'PARAMETER[[:space:]]+num_ctx[[:space:]]+16384'
          node scripts/sub4-live-rsi.mjs probe | tee "$RUNNER_TEMP/sub4-local-probe.txt"
          grep -q 'SUB4_FREE_MODEL=available' "$RUNNER_TEMP/sub4-local-probe.txt"
      - name: Real model issues actual tool calls in isolated RSI generation
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/sub4-local-source" "$GITHUB_SHA"
          export DOMINION_DATA="$RUNNER_TEMP/sub4-local-data"
          export DOMINION_WORKSPACE="$RUNNER_TEMP/sub4-local-source"
          export DOMINION_SOURCE_WORKSPACE="$RUNNER_TEMP/sub4-local-source"
          mkdir -p "$DOMINION_DATA"
          ./target/release/dominion-rust > "$RUNNER_TEMP/sub4-local-engine.log" 2>&1 &
          engine_pid=$!
          trap 'kill "$engine_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if curl -fsS "http://127.0.0.1:$DOMINION_PORT/api/health" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:$DOMINION_PORT/api/health"
          node scripts/sub4-live-rsi.mjs run
      - name: Preserve native tool operation trace and edit decision
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, sqlite3
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          db = root / "sub4-local-data" / "dominion.sqlite"
          trace = {"source": str(db), "operations": [], "executions": [], "errors": []}
          try:
              if not db.exists(): raise FileNotFoundError(str(db))
              con = sqlite3.connect(db)
              for (raw,) in con.execute("SELECT data FROM records WHERE kind='execution_operation'"):
                  op=json.loads(raw)
                  if op.get("tool") not in ("code_search","workspace_read_range","workspace_replace","workspace_replace_range","workspace_write","rsi_method_propose"):
                      continue
                  details=op.get("result") or {}
                  trace["operations"].append({
                      "tool":op.get("tool"),"status":op.get("status"),
                      "runId":op.get("runId"),"sessionId":op.get("sessionId"),
                      "arguments":{k:(str(v)[:180]) for k,v in (op.get("arguments") or {}).items()
                          if k in ("path","query","startLine","endLine")},
                      "error":str(op.get("error") or (details.get("error") if isinstance(details,dict) else "") or "")[:360]})
              for (raw,) in con.execute("SELECT data FROM records WHERE kind='execution'"):
                  ex=json.loads(raw)
                  if ex.get("rsiActionRetry") is not None:
                      trace["executions"].append({
                          "id":ex.get("id"),"sessionId":ex.get("sessionId"),
                          "rsiActionRetry":ex.get("rsiActionRetry")})
          except Exception as err:
              trace["errors"].append(str(err))
          output=root / "sub4-local-trace.json"
          output.write_text(json.dumps(trace,ensure_ascii=False,indent=2)+"\n")
          print("SUB4_NATIVE_TOOL_TRACE="+json.dumps(trace,ensure_ascii=False)[:5000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sub4-real-local-model-proof
          retention-days: 14
          if-no-files-found: ignore
          path: |
            benchmark/sub4-local-ollama-rsi-result.json
            ${{ runner.temp }}/sub4-local-trace.json
