name: Sub1 real-model RSI cycle attempt

# Run expensive live models only when explicitly requested.
# Pushes run the normal CI; a source edit must not auto-spend 45 minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-model:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DOMINION_PORT: '43173'
      DOMINION_JOB_WORKERS: '1'
      DOMINION_EXPERIMENT_SCHEDULER: '0'
      SUB1_LIVE_REPORT: benchmark/sub1-live-campaign-result.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe a genuine model, not a fixture
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sub1-live-model-campaign.mjs probe | tee /tmp/sub1-model-probe.log
          if grep -Fq 'SUB1_MODEL_REACHABLE=true' /tmp/sub1-model-probe.log; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo 'No reachable anonymous model. No autonomous improvement result is claimed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.probe.outputs.reachable == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.probe.outputs.reachable == 'true'
      - uses: actions/setup-node@v4
        if: steps.probe.outputs.reachable == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web && npm run build --prefix web
        if: steps.probe.outputs.reachable == 'true'
      - run: cargo build --release --locked --bin dominion-rust
        if: steps.probe.outputs.reachable == 'true'
      - name: Let DOMINION execute a genuine model-written source improvement
        if: steps.probe.outputs.reachable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/sub1-source" "$(git rev-parse HEAD)"
          export DOMINION_DATA="$RUNNER_TEMP/sub1-data"
          export DOMINION_WORKSPACE="$RUNNER_TEMP/sub1-source"
          export DOMINION_SOURCE_WORKSPACE="$RUNNER_TEMP/sub1-source"
          mkdir -p "$DOMINION_DATA"
          node scripts/sub1-live-model-campaign.mjs proxy > "$RUNNER_TEMP/sub1-proxy.log" 2>&1 &
          proxy_pid=$!
          ./target/release/dominion-rust > "$RUNNER_TEMP/sub1-engine.log" 2>&1 &
          engine_pid=$!
          trap 'kill "$proxy_pid" "$engine_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if curl -fsS "http://127.0.0.1:$DOMINION_PORT/api/health" > /dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:$DOMINION_PORT/api/health"
          node scripts/sub1-live-model-campaign.mjs run
          cat "$SUB1_LIVE_REPORT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sub1-real-model-attempt
          path: |
            benchmark/sub1-live-campaign-result.json
          if-no-files-found: ignore
