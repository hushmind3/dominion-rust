name: Sub4 manual platform smoke
on:
  workflow_dispatch:
concurrency:
  group: sub4-manual-smoke
  cancel-in-progress: true
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native all-target compile
        run: cargo check --all-targets
