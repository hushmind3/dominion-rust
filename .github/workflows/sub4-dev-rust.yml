name: Sub4 targeted Rust development tests
on:
  push:
    branches: [dominion-sub4]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/sub4-dev-rust.yml'
  workflow_dispatch:
concurrency:
  group: sub4-dev-rust
  cancel-in-progress: true
jobs:
  relevant-rust:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Model-authored program cursor, typed receipts, policy and crash recovery (dev profile)
        run: cargo test --lib program_session::tests
      - name: Mixed write/search/read/edit/verify via one native Run journal (dev profile)
        run: cargo test --lib programmatic_tool_calls_write_edit_search_verify_via_existing_journal
      - name: Shared typed IR and strict observation binding semantics (dev profile)
        run: cargo test --lib program_ir::tests
      - name: Bounded native execution program and read-only policy (dev profile)
        run: cargo test --lib read_program::tests
      - name: Conditional read-program through native model and journal (dev profile)
        run: cargo test --lib read_program_fuses_planning_and_skips_duplicate_model_audit
      - name: Money domain and implementation approval regressions (dev profile)
        run: 'cargo test --lib money::'
      - name: Evidence-only isolated strategy comparison invariants (dev profile)
        run: cargo test --lib runtime_trials_tests
      - name: Candidate policy, budget and cancellation regressions (dev profile)
        run: cargo test --lib strategy_trial_
      - name: Two real workspace workers and mock-model verification (dev profile)
        run: cargo test --lib strategy_trial_two_real_workers_share_base_and_settle_before_comparison
      - name: Full mock model-path correction integration (dev profile)
        run: cargo test --lib coding_fixture_repairs_two_files_after_missing_path_feedback
      - name: Indexed delegation lineage and durable restart regression (dev profile)
        run: cargo test --lib indexed_lineage_tracks_reparent_replace_and_durable_restart
      - name: Native SDK inert reservation and recovery regression (dev profile)
        run: cargo test --lib reserved_unlaunched_run_is_not_auto_resumed_on_restart
      - name: Domain approval receipt crash-state regression (dev profile)
        run: cargo test --lib committed_domain_receipt_survives_restart_without_extra_worker
      - name: Focused per-run memory cache regression (dev profile)
        run: cargo test --lib repeated_model_turns_reuse_scoped_memory_until_owner_edit
      - name: Durable memory revision persistence (dev profile)
        run: 'cargo test --lib knowledge::'
      - name: Agent context retention and repair regression (dev profile)
        run: 'cargo test --lib context::'
      - name: Evidence-driven next-step repair and observation regressions (dev profile)
        run: 'cargo test --lib repair_guidance::'
      - name: Operator tool admission and budget policy regressions (dev profile)
        run: 'cargo test --lib policy::'
      - name: Common workspace path regression (dev profile)
        run: cargo test --lib paginates_large_repository_and_searches_beyond_first_200
# Full macOS / Windows builds, frontend checks, packaging, E2E and soak
# intentionally stay in manually dispatched release workflows only.
