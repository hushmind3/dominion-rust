name: Sub4 Rust and latest-main frontend CI
on:
  push:
    branches: [dominion-sub4]
    paths:
      - 'src/**'
      - 'web/**'
      - 'sdk/**'
      - 'scripts/**'
      - 'benchmarks/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/sub4-dev-rust.yml'
  workflow_dispatch:
concurrency:
  group: sub4-dev-rust
  cancel-in-progress: true
jobs:
  frontend:
    name: Main frontend TypeScript, production bundle and UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Clean install
        run: npm ci --prefix web --no-audit --no-fund
      - name: TypeScript strict check
        run: npm run typecheck --prefix web
      - name: Production frontend bundle
        run: npm run build --prefix web
      - name: UI regressions (models, chat stop and refresh)
        working-directory: web
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: No retired Money module in active code or frontend
        run: |
          test ! -d src/money
          test ! -f web/src/pages/Money.tsx
          ! grep -R -E 'crate::money|pub mod money|MoneyPage|/money/' src web/src
  rust:
    name: Native Rust all-target compile and unit regressions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Architecture and retired runtime guard
        run: bash scripts/check-sub4-architecture.sh
      - name: All Rust targets compile
        run: cargo check --locked --all-targets
      - name: Real backend unit/integration-path regressions
        run: cargo test --locked --lib
      - name: Coding benchmark CLI contract
        run: cargo test --locked --bin dominion_coding_eval
      - name: Deterministic benchmark harness
        run: |
          python3 -m unittest discover -s benchmarks/tests -p 'test_*.py'
          python3 benchmarks/compare.py --selftest
