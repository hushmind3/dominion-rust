name: Sub4 Rust and latest-main frontend CI
on:
  push:
    branches: [dominion-sub4]
    paths:
      - 'src/**'
      - 'cloud/**'
      - 'services/dominion-cloud/**'
      - 'web/**'
      - 'sdk/**'
      - 'scripts/**'
      - 'benchmarks/**'
      - 'Cargo.toml'
      - 'crates/**'
      - 'Cargo.lock'
      - '.github/workflows/sub4-dev-rust.yml'
  workflow_dispatch:
concurrency:
  group: sub4-dev-rust
  cancel-in-progress: true
jobs:
  frontend:
    name: Main frontend TypeScript, production bundle and UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Clean install
        run: npm ci --prefix web --no-audit --no-fund
      - name: TypeScript strict check
        run: npm run typecheck --prefix web
      - name: SDK typecheck and endpoint contract tests
        run: |
          ./web/node_modules/.bin/tsc -p sdk/typescript/tsconfig.json
          node --test sdk/typescript/tests/*.test.mjs
      - name: Production frontend bundle (manual release gate)
        if: github.event_name == 'workflow_dispatch'
        run: npm run build --prefix web
      - name: UI and Cloud Worker integration regressions
        working-directory: web
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Validate ported Cloudflare Worker JavaScript
        run: node --check cloud/src/index.js
  rust:
    name: Native Rust all-target compile and unit regressions
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Architecture and retired runtime guard
        run: bash scripts/check-sub4-architecture.sh
      - name: Check cloud D1 schema and atomic operator allowance
        run: |
          python3 - <<'PY'
          import sqlite3, pathlib
          db=sqlite3.connect(':memory:')
          db.executescript(pathlib.Path('cloud/schema.sql').read_text())
          tables={row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required={'accounts','sessions','usage','free_quota','checkout_orders',
                    'subscriptions','paid_budget_daily','free_budget_daily'}
          assert required.issubset(tables), required-tables
          query=('INSERT INTO paid_budget_daily(day,reserved_micro_krw) VALUES(?,?) '
                 'ON CONFLICT(day) DO UPDATE SET reserved_micro_krw=reserved_micro_krw+excluded.reserved_micro_krw '
                 'WHERE reserved_micro_krw<=? RETURNING reserved_micro_krw')
          assert db.execute(query,('2026-11-19',100,150)).fetchone()==(100,)
          assert db.execute(query,('2026-11-19',75,50)).fetchone() is None
          assert db.execute('SELECT reserved_micro_krw FROM paid_budget_daily').fetchone()==(100,)
          print('D1 operator budget reservation is atomic and bounded')
          PY
      - name: All Rust targets compile
        run: cargo check --locked --all-targets
      - name: Real backend unit/integration-path regressions
        run: cargo test --locked --lib
      - name: Independent kernel/algorithm crate contracts
        run: cargo test --locked -p dominion-agent-core -p dominion-agent-algo
      - name: Coding benchmark CLI contract
        run: cargo test --locked --bin dominion_coding_eval
      - name: Deterministic benchmark harness
        run: |
          python3 -m unittest discover -s benchmarks/tests -p 'test_*.py'
          python3 benchmarks/compare.py --selftest

  local-prefill:
    name: 2026 Qwen3.5 GGUF on real llama.cpp CPU cache probe
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sub4-local-prefill]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download 2026 GGUF model (public Unsloth quantization)
        run: |
          mkdir -p .models
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 360 \
            -o .models/Qwen3.5-0.8B-Q4_K_M.gguf \
            "https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_K_M.gguf?download=true"
          test "$(stat -c %s .models/Qwen3.5-0.8B-Q4_K_M.gguf)" -gt 100000000
      - name: Start official prebuilt llama.cpp CPU container
        run: |
          docker run -d --rm --name dominion-sub4-llama \
            --cpus=4 -v "$PWD/.models:/models:ro" -p 127.0.0.1:8099:8080 \
            ghcr.io/ggml-org/llama.cpp:server \
            -m /models/Qwen3.5-0.8B-Q4_K_M.gguf \
            --host 0.0.0.0 --port 8080 -c 4096 -np 1 -n 16 --threads 4
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8099/health >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs dominion-sub4-llama
          exit 1
      - name: Collect actual cold/warm KV prefix evidence
        run: python3 benchmarks/local_prefill_probe.py
      - name: Upload actual local inference receipts (no user data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sub4-2026-llama-local-prefill
          path: /tmp/sub4-local-prefill.json
          if-no-files-found: ignore
      - name: Stop isolated inference container
        if: always()
        run: docker rm -f dominion-sub4-llama || true

  browser-e2e:
    name: Real Rust HTTP + Vite + Chromium integration
    needs: [frontend, rust]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sub4-browser-e2e]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned frontend dependencies
        run: npm ci --prefix web --no-audit --no-fund
      - name: Install a real Chromium browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Build the native executable for HTTP boot
        run: cargo build --locked --bin dominion
      - name: Start real backend and Vite then exercise UI and API
        working-directory: web
        run: npx playwright test e2e/native-boot.spec.ts e2e/sub4-live-api.spec.ts e2e/sub4-channels.spec.ts e2e/sub4-chat-live.spec.ts e2e/sub4-run-ux.spec.ts
      - name: Upload browser traces for failing runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sub4-browser-traces
          path: web/test-results/
          if-no-files-found: ignore
