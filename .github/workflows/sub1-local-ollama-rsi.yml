name: Sub1 real Qwen3 local-model source-edit RSI
# Run expensive live models only when explicitly requested.
# Pushes run the normal CI; a source edit must not auto-spend 45 minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-local-edit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DOMINION_LIVE_MODEL: qwen3:4b-instruct
      DOMINION_LIVE_BASE: http://127.0.0.1:44327
      DOMINION_LIVE_OLLAMA: http://127.0.0.1:11434
      OLLAMA_CONTEXT_LENGTH: '16384'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_KEEP_ALIVE: '45m'
      DOMINION_PORT: '44327'
      DOMINION_JOB_WORKERS: '1'
      DOMINION_EXPERIMENT_SCHEDULER: '0'
      DOMINION_BACKUP_INTERVAL_SECS: '0'
      DOMINION_RSI_REAL_MODEL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build actual Sub1 engine
        run: |
          node --check scripts/sub1-local-ollama-rsi.mjs
          cargo build --release --locked --bin dominion-rust
      - name: Run true local Qwen3 inference provider
        run: |
          curl -fsSL https://ollama.com/install.sh -o "$RUNNER_TEMP/ollama-install.sh"
          sh "$RUNNER_TEMP/ollama-install.sh"
          sudo systemctl disable --now ollama || true
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags
          if grep -Fq 'bind: address already in use' "$RUNNER_TEMP/ollama.log"; then exit 1; fi
          ollama pull "$DOMINION_LIVE_MODEL"
      - name: Start isolated Sub1 worktree and native server
        run: |
          git worktree add --detach "$RUNNER_TEMP/sub1-source" "$(git rev-parse HEAD)"
          echo "DOMINION_DATA=$RUNNER_TEMP/sub1-data" >> "$GITHUB_ENV"
          echo "DOMINION_WORKSPACE=$RUNNER_TEMP/sub1-source" >> "$GITHUB_ENV"
          echo "DOMINION_LIVE_REPORT=$RUNNER_TEMP/sub1-local-rsi.json" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/sub1-data"
          DOMINION_DATA="$RUNNER_TEMP/sub1-data" DOMINION_WORKSPACE="$RUNNER_TEMP/sub1-source" \
            nohup ./target/release/dominion-rust > "$RUNNER_TEMP/sub1-engine.log" 2>&1 &
      - name: Execute real model source-edit campaign
        run: |
          node scripts/sub1-local-ollama-rsi.mjs
      - name: Extract actual tool-stage and source-edit receipts
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import sqlite3,json,os
          root=os.environ.get("DOMINION_DATA","")
          path=os.path.join(root,"dominion.sqlite")
          out=os.path.join(os.environ.get("RUNNER_TEMP","/tmp"),"sub1-local-operations.json")
          evidence={"operationCalls":[],"checkpoints":[],"error":None}
          try:
              connection=sqlite3.connect(path)
              for (raw,) in connection.execute("SELECT data FROM records WHERE kind='execution_operation'"):
                  try: row=json.loads(raw)
                  except (TypeError,ValueError): continue
                  if row.get("tool") in ("code_search","workspace_read_range","workspace_replace","workspace_replace_range","workspace_write"):
                      result=row.get("result") or {}
                      receipt=row.get("toolReceipt") or {}
                      evidence["operationCalls"].append({"tool":row.get("tool"),"status":row.get("status"),
                          "written":result.get("written") is True,
                          "independentlyVerified":receipt.get("verified") is True,
                          "error":str(row.get("error") or result.get("error") or "")[:250]})
              for event,raw in connection.execute("SELECT event,detail FROM audit WHERE event IN ('rsi.action_checkpoint','rsi.edit_retry','rsi.action_program_selected','rsi.structured_patch_interpreted')"):
                  try: details=json.loads(raw)
                  except (TypeError,ValueError): details={}
                  evidence["checkpoints"].append({"event":event,"toolCalls":details.get("toolCalls"),
                      "chosenTool":details.get("chosenTool") or details.get("tool"),
                      "reason":details.get("reason"),
                      "editOnly":details.get("editOnly"),"readCalls":details.get("readCalls")})
          except Exception as error:
              evidence["error"]=str(error)
          with open(out,"w") as file: json.dump(evidence,file,indent=2)
          print("SUB1_REAL_ACTION_RECEIPTS="+json.dumps(evidence))
          PY
      - name: Persist independent model, engine, and tool evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sub1-local-model-rsi-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/sub1-local-rsi.json
            ${{ runner.temp }}/sub1-local-operations.json
            ${{ runner.temp }}/sub1-engine.log
            ${{ runner.temp }}/ollama.log
