name: Champion real Ollama inference and tool-loop smoke

on:
  push:
    branches: [dominion-champion]
    paths:
      - '.github/workflows/champion-ollama-live.yml'
      - 'scripts/champion-ollama-live.mjs'
      - 'src/engine/chat/provider.rs'
      - 'src/engine/gateway.rs'
      - 'src/engine/chat/runtime.rs'
      - 'src/engine/rsi_evolve.rs'
      - 'src/engine/rsi_action_program.rs'
      - 'src/engine/rsi_repair_synthesis.rs'
      - 'src/engine/rsi_success_ablation.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-ollama:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOMINION_LIVE_MODEL: qwen3:4b-instruct
      DOMINION_LIVE_BASE: http://127.0.0.1:44327
      DOMINION_LIVE_OLLAMA: http://127.0.0.1:11434
      OLLAMA_CONTEXT_LENGTH: '16384'
      OLLAMA_NUM_PARALLEL: '1'
      DOMINION_PORT: '44327'
      DOMINION_JOB_WORKERS: '1'
      DOMINION_EXPERIMENT_SCHEDULER: '0'
      DOMINION_BACKUP_INTERVAL_SECS: '0'
    steps:
      - name: Checkout Champion exact code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the real native engine
        run: |
          node --check scripts/champion-ollama-live.mjs
          cargo build --release --locked --bin dominion-rust
      - name: Launch real Ollama and download model
        run: |
          curl -fsSL https://ollama.com/install.sh -o "${RUNNER_TEMP}/ollama-install.sh"
          sh "${RUNNER_TEMP}/ollama-install.sh"
          nohup ollama serve > "${RUNNER_TEMP}/ollama-live.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "${DOMINION_LIVE_MODEL}"
      - name: Boot isolated DOMINION Rust engine
        run: |
          mkdir -p "${RUNNER_TEMP}/dominion-live/data" "${RUNNER_TEMP}/dominion-live/workspace"
          echo "DOMINION_LIVE_REPORT=${RUNNER_TEMP}/dominion-live/champion-ollama-evidence.json" >> "${GITHUB_ENV}"
          DOMINION_DATA="${RUNNER_TEMP}/dominion-live/data" \
            DOMINION_WORKSPACE="${RUNNER_TEMP}/dominion-live/workspace" \
            nohup ./target/release/dominion-rust > "${RUNNER_TEMP}/dominion-live/engine.log" 2>&1 &
      - name: Actual-model inference and tool execution attempt
        run: node scripts/champion-ollama-live.mjs
      - name: Save actual receipts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: champion-real-ollama-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/dominion-live/champion-ollama-evidence.json
            ${{ runner.temp }}/dominion-live/engine.log
            ${{ runner.temp }}/ollama-live.log
