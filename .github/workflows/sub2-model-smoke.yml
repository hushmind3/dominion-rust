name: Sub2 GitHub Models native tool preflight
on:
  workflow_dispatch:
  push:
    branches: [dominion-sub2]
    paths: ['.github/workflows/sub2-model-smoke.yml']
permissions:
  contents: read
  models: read
jobs:
  tool-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify real hosted model and native tool-call contract
        env:
          GITHUB_MODELS_KEY: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const report=[];
          for(const model of ['openai/gpt-4.1','openai/gpt-4o']){
            try{
              const r=await fetch('https://models.github.ai/inference/chat/completions',{
                method:'POST',
                headers:{authorization:'Bearer '+process.env.GITHUB_MODELS_KEY,
                  'content-type':'application/json'},
                body:JSON.stringify({model,stream:false,temperature:0,
                  messages:[{role:'user',content:'Call code_search with query memory_retrieve before answering.'}],
                  tools:[{type:'function',function:{name:'code_search',
                    description:'Find Rust source symbols',
                    parameters:{type:'object',properties:{query:{type:'string'}},required:['query']}}}],
                  tool_choice:'required'}),
                signal:AbortSignal.timeout(40000)
              });
              const x=await r.json().catch(()=>({}));
              const c=x.choices?.[0]||{},m=c.message||{};
              report.push({model,http:r.status,keys:Object.keys(x),
                choiceKeys:Object.keys(c),messageKeys:Object.keys(m),
                finish:c.finish_reason,toolNames:m.tool_calls?.map(t=>t?.function?.name)||[],
                contentPreview:typeof m.content==='string'?m.content.slice(0,180):null,
                errorType:x.error?.type||null,errorCode:x.error?.code||null});
            }catch(error){report.push({model,error:String(error)})}
          }
          console.log(JSON.stringify(report,null,2));
          NODE
