name: Sub4 genuine model read-to-edit proof
on:
  push:
    branches: [dominion-sub4]
    paths:
      - '.github/workflows/sub4-live-rsi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-rsi:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      DOMINION_PORT: '43179'
      SUB4_LIVE_REPORT: benchmark/sub4-live-rsi-result.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate live script and probe a real remote model
        id: probe
        shell: bash
        run: |
          node --check scripts/sub4-live-rsi.mjs
          node scripts/sub4-live-rsi.mjs probe | tee "$RUNNER_TEMP/sub4-probe.txt"
          if grep -q 'SUB4_FREE_MODEL=available' "$RUNNER_TEMP/sub4-probe.txt"; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Actual remote model unavailable; no fabricated test.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.probe.outputs.available == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.probe.outputs.available == 'true'
      - name: Build real DOMINION binary
        if: steps.probe.outputs.available == 'true'
        run: |
          npm ci --prefix web
          npm run build --prefix web
          cargo build --release --locked --bin dominion-rust
      - name: Run actual provider -> model -> source tools -> frozen RSI
        if: steps.probe.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/sub4-source" "$GITHUB_SHA"
          export DOMINION_DATA="$RUNNER_TEMP/sub4-data"
          export DOMINION_WORKSPACE="$RUNNER_TEMP/sub4-source"
          export DOMINION_SOURCE_WORKSPACE="$RUNNER_TEMP/sub4-source"
          mkdir -p "$DOMINION_DATA"
          node scripts/sub4-live-rsi.mjs proxy > "$RUNNER_TEMP/sub4-proxy.log" 2>&1 &
          proxy_pid=$!
          ./target/release/dominion-rust > "$RUNNER_TEMP/sub4-engine.log" 2>&1 &
          engine_pid=$!
          trap 'kill "$proxy_pid" "$engine_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if curl -fsS "http://127.0.0.1:$DOMINION_PORT/api/health" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:$DOMINION_PORT/api/health"
          node scripts/sub4-live-rsi.mjs run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sub4-genuine-model-proof
          retention-days: 14
          if-no-files-found: ignore
          path: |
            benchmark/sub4-live-rsi-result.json
