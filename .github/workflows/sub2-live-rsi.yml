name: Sub2 live local-model RSI proof

# Experimental research is informed by GitHub AI-Scientist-v2's tested
# experiment-tree approach and Agent Lightning's real-harness feedback.
# Compiler-assisted patch repair is adapted from DOMINION sub3, with all
# candidate gains still judged by the unchanged frozen A/B oracle.
# Heavy Qwen/Ollama experiments are explicit opt-in, never auto-launched
# by ordinary engine commits. The short native CI remains on every push.
on:
  workflow_dispatch:
  # One real-model probe when this workflow definition changes on Sub2.
  # Ordinary code pushes continue to run only fast CI, not heavy inference.
  push:
    branches: [dominion-sub2]
    paths:
      - .github/workflows/sub2-live-rsi.yml

# This dispatch is intentionally renewed after fixing the mismatch between
# Qwen's indexed-source edit checkpoint and its advertised tool menu.
# The proof remains fully model-driven: no synthetic patch or acceptance.
# Exercise source-derived improvements in TWO independent domains: owner
# memory retrieval and the improver's own search feature computation.
# Source-induced revisions use the same compiled, frozen paired holdout as
# model-written revisions; neither earns a success until measured. A later
# committed binary must generate and adopt the next improvement itself.
# The probe exits as soon as three consecutive verified generations establish
# actual improver gain and cross-domain transfer.
# Preserve each admitted experiment to completion. New source commits
# must not erase the only live A/B evidence of earlier descendants. The
# immutable revision and run ID distinguish runs; no production ref is changed.
concurrency:
  group: sub2-native-live-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  native-live-rsi:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      DOMINION_LIVE_MODEL: qwen3:4b-instruct
      DOMINION_LIVE_BASE: http://127.0.0.1:44327
      DOMINION_LIVE_OLLAMA: http://127.0.0.1:11434
      DOMINION_LIVE_TIMEOUT_MS: '3060000'
      OLLAMA_CONTEXT_LENGTH: '16384'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_KEEP_ALIVE: '45m'
      DOMINION_PORT: '44327'
      DOMINION_JOB_WORKERS: '1'
      DOMINION_SOURCE_WORKSPACE: ${{ github.workspace }}
      DOMINION_EXPERIMENT_SCHEDULER: '0'
      DOMINION_BACKUP_INTERVAL_SECS: '0'
      DOMINION_RSI_REAL_MODEL: '1'
    steps:
      - name: Checkout exact Sub2 source and full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Validate live probe script and build the real native engine
        run: |
          node --check scripts/sub2-live-rsi.mjs
          cargo build --release --locked --bin dominion-rust

      - name: Check source-derived descendants and compiler recovery before live inference
        run: |
          cargo test --release --locked --bin dominion-rust rsi_mutation::tests -- --nocapture
          cargo test --release --locked --bin dominion-rust rsi_compiler_repair::tests -- --nocapture

      - name: Verify the actual campaign objective selects memory and improver only
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const source = readFileSync('scripts/sub2-live-rsi.mjs','utf8');
          const match = source.match(/request:\s*("(?:\\.|[^"\\])*"),\s*\n\s*focusFiles:/u);
          if (!match) throw Error('RSI campaign objective is not a literal');
          const goal = JSON.parse(match[1]);
          if (!goal.includes('기억') || !goal.includes('자기개선')
              || ['토큰','문맥','대화','캐시','학습','지식','경험','검색','도구','모델','화면','버튼','사용성','인터페이스']
                  .some(word => goal.includes(word)))
            throw Error('RSI campaign objective would redirect source-domain selection');
          NODE


      - name: Install actual local inference runtime
        run: |
          curl -fsSL https://ollama.com/install.sh -o "${RUNNER_TEMP}/ollama-install.sh"
          sh "${RUNNER_TEMP}/ollama-install.sh"
          ollama --version
          # The installer auto-starts a systemd Ollama daemon with its default
          # 4096-token context. Stop it: a second "ollama serve" would silently
          # fail to bind and DOMINION's 16k model calls would receive HTTP 400.
          sudo systemctl disable --now ollama
          nohup ollama serve > "${RUNNER_TEMP}/ollama-live.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          if grep -Fq 'bind: address already in use' "${RUNNER_TEMP}/ollama-live.log"; then
            echo "Ollama custom-context daemon failed to start" >&2
            exit 1
          fi
          ollama pull "${DOMINION_LIVE_MODEL}"

      - name: Boot isolated DOMINION engine at same checked-out revision
        run: |
          mkdir -p "${RUNNER_TEMP}/dominion-live"
          echo "DOMINION_DATA=${RUNNER_TEMP}/dominion-live/data" >> "${GITHUB_ENV}"
          echo "DOMINION_WORKSPACE=${RUNNER_TEMP}/dominion-live/workspace" >> "${GITHUB_ENV}"
          echo "DOMINION_LIVE_REPORT=${RUNNER_TEMP}/dominion-live/live-rsi-receipt.json" >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/dominion-live/data/rsi-build" "${RUNNER_TEMP}/dominion-live/workspace"
          # Reuse the compiled dependencies from the exact checked-out source.
          # The RSI coordinator still invokes cargo with its per-commit
          # DOMINION_RSI_BUILD_COMMIT marker, rebuilding the changed engine
          # itself for each accepted descendant instead of faking lineage.
          ln -s "${GITHUB_WORKSPACE}/target" "${RUNNER_TEMP}/dominion-live/data/rsi-build/generator"
          DOMINION_DATA="${RUNNER_TEMP}/dominion-live/data" \
            DOMINION_WORKSPACE="${RUNNER_TEMP}/dominion-live/workspace" \
            nohup ./target/release/dominion-rust > "${RUNNER_TEMP}/dominion-live/engine.log" 2>&1 &

      - name: Execute actual model improvement and frozen native A/B
        run: node scripts/sub2-live-rsi.mjs

      - name: Show actual source-edit and frozen evaluation receipts
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync, appendFileSync } from 'node:fs';
          const path = process.env.DOMINION_LIVE_REPORT;
          if (!path || !existsSync(path)) {
            console.log('No actual model receipt: native engine did not reach the RSI campaign.');
            process.exit(0);
          }
          const receipt = JSON.parse(readFileSync(path, 'utf8'));
          const lines = ['### Actual Sub2 live RSI evidence',
            'Status: '+receipt.status+'; accepted generations: '+receipt.acceptedGenerations,
            'Error: '+(receipt.error || 'none')];
          for (const generation of receipt.history || []) {
            lines.push('- Generation '+generation.attempt+
              ': operator='+(generation.nativeMutation?.operator || 'model')+
              '; actual new diff='+generation.novelSourceDiffBytes+
              ' bytes; edits='+(generation.editActions || []).filter(x=>x.written).length+
              '; compile='+generation.staticChecksPassed+
              '; candidate='+(generation.candidateId || generation.unverifiedCandidateId || 'none')+
              '; frozen A/B='+(generation.verdict || 'not measured')+
              '; holdout gains='+(generation.improvedHoldouts ?? 'not measured')+
              '; accepted='+generation.accepted);
          }
          console.log(lines.join('\n'));
          if (process.env.GITHUB_STEP_SUMMARY)
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n')+'\n');
          NODE

      - name: Publish outcome and raw local-engine diagnostics, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sub2-native-live-rsi-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/dominion-live/live-rsi-receipt.json
            ${{ runner.temp }}/dominion-live/engine.log
            ${{ runner.temp }}/ollama-live.log
