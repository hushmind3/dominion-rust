name: Sub4 inherited RSI proof and full source validation
on:
  push:
    branches: [dominion-sub4]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sub4-proof-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit native RSI Git lineage and frozen paired receipts
        run: |
          node --check scripts/sub4-audit-inherited-proof.mjs
          node scripts/sub4-audit-inherited-proof.mjs
      # The general CI workflow independently runs full Rust + frontend
      # checks for this same SHA. Do not run both complete builds per push.
