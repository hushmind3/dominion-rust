name: Sub3 official Copilot SDK Rust adapter build

on:
  push:
    branches: [dominion-sub3]
    paths:
      - 'Cargo.toml'
      - '.github/workflows/sub3-copilot-sdk-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sdk-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify official SDK compilation, not a mock SDK
        run: cargo check --features copilot-harness --bin dominion-rust
      - name: Preserve exact dependency resolution for locked desktop releases
        if: success()
        run: |
          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(sub3): lock official Copilot SDK dependency graph"
            git push origin HEAD:dominion-sub3
          fi
      - name: Confirm the native Rust feature can be checked under locked mode
        run: cargo check --locked --features copilot-harness --bin dominion-rust
