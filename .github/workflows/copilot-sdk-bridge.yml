name: Copilot SDK optional bridge check

on:
  workflow_dispatch:
  push:
    branches:
      - dominion-champion
    paths:
      - 'integrations/copilot-sdk-rust/**'
      - '.github/workflows/copilot-sdk-bridge.yml'

jobs:
  rust-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrations/copilot-sdk-rust -> target
      - name: Check actual official Copilot SDK integration (no model credentials)
        run: cargo test --manifest-path integrations/copilot-sdk-rust/Cargo.toml --release
      - name: Assert no paid provider evaluation was implied
        run: |
          test -f integrations/copilot-sdk-rust/src/main.rs
          echo "SDK client compilation only; no provider login, model usage, coding task, or quality oracle was run."
