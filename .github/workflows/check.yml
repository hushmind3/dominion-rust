name: Sub4 Windows and macOS checks
on:
  push:
    branches: [dominion-sub4]
  workflow_dispatch:
    inputs:
      extended:
        description: 'Run browser and live MCP/soak checks'
        type: boolean
        default: false
concurrency:
  group: sub4-platform-checks
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Native engine regressions and platform tests
        run: |
          cargo fmt --all
          cargo test --all-targets
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Bounded modules and frontend tests
        run: |
          node scripts/check-source-size.mjs
          cd web
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test:refresh
          npm run build
      - name: Browser against the real Rust adapter and mock provider
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.extended }}
        working-directory: web
        run: |
          npx playwright install chromium
          npm run e2e
      - name: TypeScript SDK contract
        working-directory: sdk/typescript
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Deterministic benchmark harness
        run: python3 benchmarks/compare.py --selftest
      - name: Extended native durability and public MCP interop
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.extended }}
        run: |
          cargo test --lib soak_parallel_durable_workloads -- --ignored --nocapture
          DOMINION_LONG_SOAK_SECONDS=30 cargo test --lib continuous_recovery_and_cancellation_soak -- --ignored --nocapture
          cargo test --lib live_public_streamable_http_interop -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sub4-macos-browser-traces
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 5
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check native SDK and binaries on Windows
        run: cargo check --all-targets
      - name: Windows native regressions
        run: cargo test --lib
