name: Sub4 build checks
on:
  push:
    branches: [dominion-sub4]
  workflow_dispatch:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Normalize formatting for compile check
        run: cargo fmt --all
      - name: Compile and test
        run: cargo test --all-targets
      - name: Real RSI Git worktree repair, detached judge, adoption and descendant E2E
        # Only fixed local fixture commands and a loopback mock provider.
        # Not a production sandbox override or proof of real-model quality.
        env:
          DOMINION_SHELL_SANDBOX: 'off'
        run: cargo test --lib improvement::full_cycle_tests:: -- --ignored --nocapture
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  external-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Live public no-auth MCP 2026 Streamable HTTP interoperability
        run: cargo test --lib live_public_streamable_http_interop -- --ignored --nocapture
      - name: Live public DeepWiki MCP cross-server compatibility
        env:
          DOMINION_LIVE_MCP_URL: https://mcp.deepwiki.com/mcp
        run: cargo test --lib live_public_streamable_http_interop -- --ignored --nocapture

  durability-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fsync crash-recovery 256-run load and latency measurement
        run: cargo test --lib soak_parallel_durable_workloads -- --ignored --nocapture
      - name: Thirty-second repeated crash/approval/cancel recovery soak
        env:
          DOMINION_LONG_SOAK_SECONDS: '30'
        run: cargo test --lib continuous_recovery_and_cancellation_soak -- --ignored --nocapture

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web and Chromium
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Exercise real Rust API, React browser and mock provider
        working-directory: web
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dominion-browser-traces
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 5

  benchmark-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Reproducible matched-workspace runner and honest telemetry selftest
        run: python3 benchmarks/compare.py --selftest
