name: CI

on:
  push:
  pull_request:

# Each source revision supersedes its predecessor; obsolete concurrent runs
# consume Chrome/CPU resources and can cause unrelated E2E timeouts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run build --prefix web
      - run: bash -n scripts/rsi-lab.sh
      - run: cargo test --release
        env:
          # Exercise real Chrome CDP even on CI with restricted namespaces.
          DOMINION_BROWSER_NO_SANDBOX: '1'
