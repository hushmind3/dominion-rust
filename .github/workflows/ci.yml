name: CI

on:
  push:
  pull_request:

# Rapid source revisions should compile only the newest branch state.
# A completed commit remains independently auditable in Actions history.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix web
      - run: node scripts/verify-frontend-navigation.mjs
      - run: npm run typecheck --prefix web
      - run: npm run build --prefix web
      - run: bash -n scripts/rsi-lab.sh
      - run: cargo test --release
