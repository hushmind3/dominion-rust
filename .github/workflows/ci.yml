name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_windows_suite:
        description: 'Run the currently non-portable full Windows Rust fixture suite (may fail on file locks)'
        type: boolean
        default: false

permissions:
  contents: read

# Only the latest commit on a branch needs a full release-mode validation.
# Superseded commits are cancelled instead of occupying the runner queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run build --prefix web
      - run: node --check scripts/rsi-lab.mjs
      - run: node --test scripts/rsi-lab.test.mjs
      # Linux/macOS run the complete release test suite. Existing Windows
      # fixture cleanup uses POSIX unlink semantics with live SQLite handles;
      # do not mislabel those 76 known Windows fixture failures as RSI failures.
      # Windows still MUST compile the complete test binary and execute the
      # independently sealed descendant/controller contract regressions.
      - name: Full Rust release suite (Linux and macOS)
        if: runner.os != 'Windows'
        run: cargo test --release
      - name: Compile complete Rust release test binary (Windows)
        if: runner.os == 'Windows'
        run: cargo test --release --no-run
      - name: Execute RSI descendant contract smoke tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --release descendant_controller_contract_tests -- --test-threads=1
      - name: Windows full fixture suite (manual compatibility audit)
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.full_windows_suite
        run: cargo test --release
