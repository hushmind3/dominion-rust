name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run build --prefix web
      - run: node --test scripts/sub2-goal-eval.test.mjs
      # Baseline policy tests never load/install the Copilot SDK or call models.
      - run: node --check scripts/copilot-sdk-baseline/runner.mjs
      - run: node --test scripts/copilot-sdk-baseline/runner.test.mjs
      - run: bash -n scripts/rsi-lab.sh
      - run: cargo test --release
