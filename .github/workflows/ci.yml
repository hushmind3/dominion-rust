name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Only the latest commit on a branch needs a full release-mode validation.
# Superseded commits are cancelled instead of occupying the runner queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run build --prefix web
      - run: node --check scripts/rsi-lab.mjs
      - run: node --test scripts/rsi-lab.test.mjs
      - run: cargo test --release
