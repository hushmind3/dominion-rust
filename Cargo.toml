[workspace]
members = [".", "crates/dominion-agent-core", "crates/dominion-agent-algo"]
resolver = "2"

[package]
name = "dominion"
default-run = "dominion"
version = "0.1.0"
edition = "2021"
description = "Dominion autonomous execution engine"
license = "Apache-2.0"

[dependencies]
dominion-agent-core = { path = "crates/dominion-agent-core" }
dominion-agent-algo = { path = "crates/dominion-agent-algo" }
axum = { version = "0.8", features = ["json", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-stream = "0.3"
futures-core = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
sha2 = "0.10"
tower-http = { version = "0.6", features = ["fs"] }
