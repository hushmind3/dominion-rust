[package]
name = "dominion-rust"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
# Opt-in to GitHub's first-party Rust coding-agent harness. Existing local
# Ollama/OpenAI-compatible providers remain available without this SDK.
copilot-harness = ["dep:github-copilot-sdk"]

[dependencies]
# Official Copilot Agent SDK (MIT). No runtime/auth/token use unless selected.
# The CLI must be installed and authenticated when the opt-in feature is enabled.
github-copilot-sdk = { version = "=1.0.34", default-features = false, features = ["runtime"], optional = true }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
async-stream = "0.3"
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
resvg = "0.49"


[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
