[package]
name = "dominion-sdk"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "First-party native Rust SDK for the Dominion autonomous agent runtime"
repository = "https://github.com/hushmind3/dominion-rust"
readme = "README.md"
keywords = ["agents", "sdk", "rust", "automation"]
categories = ["api-bindings", "asynchronous"]
publish = false

[dependencies]
async-stream = "0.3"
eventsource-stream = "0.2.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
