[package]
name = "dominion-copilot-sdk-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

# Isolated optional binary; not part of DOMINION's default Cargo build.
# Uses GitHub's official MIT-licensed Rust SDK and packaged Copilot CLI.
[dependencies]
github-copilot-sdk = "=1.0.34"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
